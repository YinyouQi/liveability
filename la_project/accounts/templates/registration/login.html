{% extends 'liveability/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden hover-lift">
            <div class="card-header bg-dark text-white text-center py-4 border-0">
                <h3 class="fw-bold mb-0">欢迎回来</h3>
                <p class="small opacity-50 mb-0">Welcome back to Liveability Radar</p>
            </div>
            
            <div class="card-body p-4 p-lg-5">
                {% if form.errors %}
                <div class="alert alert-danger small py-2">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>用户名或密码错误
                </div>
                {% endif %}

                <form action="{% url 'accounts:login' %}" method='post'>
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">用户名 Username</label>
                        <input type="text" name="username" class="form-control form-control-lg bg-light border-0 fs-6" placeholder="请输入您的账号" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">密码 Password</label>
                        <input type="password" name="password" class="form-control form-control-lg bg-light border-0 fs-6" placeholder="请输入密码" required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold shadow-sm">
                        立即登录 <i class="bi bi-box-arrow-in-right ms-2"></i>
                    </button>
                </form>

                <div class="mt-4 text-center">
                    <p class="small text-muted mb-0">还没有账号？ 
                        <a href="{% url 'accounts:register' %}" class="text-primary text-decoration-none fw-bold">立即注册</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
