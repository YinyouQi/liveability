{% extends "liveability/base.html" %}

{% block content %}
<div class="container-fluid px-0" style="margin-top: -1.5rem;">
    <div class="row g-0" style="min-height: 90vh;">
        <!-- 左侧：视觉区 -->
        <!-- 修改 register.html 左侧 div -->
<div class="col-lg-6 d-none d-lg-flex flex-column justify-content-center align-items-center text-white p-5" 
     style="background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=2000&auto=format&fit=crop'); background-size: cover; background-position: center;">
    <div class="text-center">
        <h1 class="display-3 fw-bold mb-4" style="text-shadow: 2px 2px 10px rgba(0,0,0,0.5);">加入全球洞察</h1>
        <p class="fs-4 opacity-75">注册以解锁更多预测模型与城市对比功能。</p>
        <div class="mt-5">
            <span class="badge rounded-pill bg-primary px-4 py-2 me-2 shadow">NEW</span>
            <span class="text-white-50">Global Liveability Index 2027</span>
        </div>
    </div>
</div>

        <!-- 右侧：注册表单 -->
        <div class="col-lg-6 d-flex flex-column justify-content-center align-items-center bg-white p-5">
            <div class="w-100" style="max-width: 500px;">
                <div class="mb-4">
                    <h2 class="fw-bold text-dark display-6">创建账号</h2>
                    <p class="text-muted">开启您的全球城市数据之旅</p>
                </div>

                <form method="post" action="{% url 'accounts:register' %}">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3 django-field-wrapper">
                        <label class="form-label fw-bold small text-muted">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-lg mt-4 rounded-3">
                        确认注册 <i class="bi bi-person-plus ms-2"></i>
                    </button>
                </form>
                <p class="text-center text-muted mt-4">已有账号？ <a href="{% url 'accounts:login' %}" class="fw-bold text-primary text-decoration-none">直接登录</a></p>
            </div>
        </div>
    </div>
</div>

<style>
    .django-field-wrapper input {
        display: block; width: 100%; padding: 0.8rem 1rem;
        border: 2px solid #eee; border-radius: 8px; font-size: 1rem;
    }
    .django-field-wrapper input:focus { border-color: #0d6efd; outline: none; }
</style>
{% endblock content %}
