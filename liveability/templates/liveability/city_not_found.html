{% extends "liveability/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow-sm border-0">
                <div class="card-body py-5">
                    <i class="bi bi-exclamation-triangle display-1 text-warning mb-4 d-block"></i>
                    <h1 class="display-5 mb-3">城市未找到</h1>
                    <p class="lead text-muted mb-4">
                        抱歉，未找到城市 "{{ city_name }}" 的相关数据
                    </p>
                    <p class="mb-4">请检查城市名称拼写是否正确，或尝试搜索其他城市</p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'liveability:city_search' %}" class="btn btn-primary btn-lg px-4">
                            <i class="bi bi-search me-2"></i>重新搜索
                        </a>
                        <a href="{% url 'liveability:index' %}" class="btn btn-outline-secondary btn-lg px-4">
                            <i class="bi bi-house me-2"></i>返回首页
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
