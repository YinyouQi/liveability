<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liveability Radar</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- ✨ 加上这一行：Plotly 图表引擎库 ✨ -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body class="bg-light">

    <!-- 全局顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <!-- 这里可以加个 Django 的 url 链接，指向主页 -->
            <a class="navbar-brand fw-bold" href="#">🌍 Liveability Radar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- 这里将来要替换成 Django 的判断用户是否登录的逻辑 (第19章) -->
                    <li class="nav-item"><a class="nav-link" href="#">登录</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary text-white ms-2 px-3" href="#">注册账号</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 核心内容区 (子页面将在这里插入内容) -->
    <main class="container">
        {% block content %}
        {% endblock content %}
    </main>

    <!-- 引入 Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
