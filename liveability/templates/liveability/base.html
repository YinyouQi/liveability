<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liveability Radar</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- ✨ 这是新加的：引入 Bootstrap 图标库 ✨ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- ✨ 加上这一行：Plotly 图表引擎库 ✨ -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body class="bg-light">

    <!-- 全局顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'liveability:index' %}">🌍 Liveability Radar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- 左侧菜单：加入方法论页面入口 -->
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'liveability:methodology' %}">📚 数据来源与预测模型</a>
                    </li>
                </ul>

                <!-- 右侧菜单：用户模块 -->
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <!-- 给 B 留的坑：我的收藏 -->
                        <li class="nav-item me-3">
                            <a class="nav-link text-warning fw-bold" href="#">⭐ 我的收藏夹</a> 
                        </li>
                        <li class="nav-item me-3">
                            <span class="nav-link text-light">你好, {{ user.username }}</span>
                        </li>
                        <li class="nav-item">
                            <form action="{% url 'accounts:logout' %}" method="post" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-light btn-sm mt-1">注销</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'accounts:login' %}">登录</a>
                        </li>
                        <li class="nav-item ms-2">
                            <a class="btn btn-primary btn-sm mt-1" href="{% url 'accounts:register' %}">注册账号</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- 核心内容区 (子页面将在这里插入内容) -->
    <main class="container">
        {% block content %}
        {% endblock content %}
    </main>

    <!-- 引入 Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
