{% extends "liveability/base.html" %}

{% block content %}
<div class="p-5 mb-4 bg-white rounded-3 shadow-sm text-center">
    <div class="container-fluid py-5">
        <h1 class="display-4 fw-bold text-primary mb-3">🌍 全球城市宜居度大 PK</h1>
        <p class="col-md-8 mx-auto fs-4 text-muted mb-5">
            输入两个城市名（英文），从安全、医疗、生活成本、实时气候等 9 大维度进行深度对决。
        </p>
        
        <!-- 双城市搜索对决区 -->
        <div class="row justify-content-center">
            <div class="col-md-9">
                <div class="card shadow-lg border-0 p-4 bg-light">
                    
                    <!-- 极其关键：定义 Datalist 接收后端的城市列表 -->
                    <datalist id="citiesList">
                        {% for city in city_list %}
                            <option value="{{ city }}"></option>
                        {% endfor %}
                    </datalist>

                    <div class="row g-3 align-items-center text-center">
                        <div class="col-md-5">
                            <label class="form-label fw-bold text-secondary">城市 A</label>
                            <!-- 注意这里加了 list="citiesList" -->
                            <input type="text" id="city1" list="citiesList" class="form-control form-control-lg border-primary shadow-sm" placeholder="输入并选择城市..." required>
                        </div>
                        <div class="col-md-2 mt-4 fw-bold fs-2 text-danger">VS</div>
                        <div class="col-md-5">
                            <label class="form-label fw-bold text-secondary">城市 B</label>
                            <!-- 这里也加了 list="citiesList" -->
                            <input type="text" id="city2" list="citiesList" class="form-control form-control-lg border-primary shadow-sm" placeholder="输入并选择城市..." required>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button onclick="goToDashboard()" class="btn btn-primary btn-lg px-5 fw-bold shadow">🚀 开启巅峰对决</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- 热门推荐 -->
        <div class="mt-5 text-muted small">
            🔥 热门对比：
            <a href="/dashboard/Shanghai/New%20York/" class="badge bg-secondary text-decoration-none mx-1 py-2 px-3">上海 VS 纽约</a>
            <a href="/dashboard/London/Paris/" class="badge bg-secondary text-decoration-none mx-1 py-2 px-3">伦敦 VS 巴黎</a>
        </div>
    </div>
</div>

<script>
// 这里是对接 B 路由的关键逻辑
function goToDashboard() {
    const c1 = document.getElementById('city1').value.trim();
    const c2 = document.getElementById('city2').value.trim();
    if(c1 && c2) {
        // 跳转到 B 规定的路由：/dashboard/城市A/城市B/
        window.location.href = `/dashboard/${c1}/${c2}/`;
    } else {
        alert("请输入两个城市名称（英文）进行对比！");
    }
}
</script>
{% endblock content %}
